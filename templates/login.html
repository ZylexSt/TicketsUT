{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Tickets UTCJ</title>
  <link rel="stylesheet" href="{% static 'css/login.css' %}" />
</head>

<body>

  <!-- PANEL IZQUIERDO -->
  <div class="panel-izquierdo">
    <div class="marca">

      <div class="marca-icono">
        <svg viewBox="0 0 24 24">
          <path d="M2 9a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1.5a1.5 1.5 0 0 0 0 3V15a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1.5a1.5 1.5 0 0 0 0-3V9Z"/>
          <path d="M9 7v10" stroke-dasharray="2 2"/>
        </svg>
      </div>

      <h1 class="marca-nombre">Tickets <span>UTCJ</span></h1>
      <div class="marca-separador"></div>
      <p class="marca-descripcion">Sistema interno de gestión de incidencias y soporte técnico.</p>

    </div>
  </div>

  <!-- PANEL DERECHO -->
  <div class="panel-derecho">

    <div class="encabezado-form">
      <h2>Bienvenido de nuevo</h2>
      <p>Accede con tus credenciales institucionales.</p>
    </div>

    <form method="POST" class="formulario">
      {% csrf_token %}

      <div class="campo">
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" required placeholder="usuario@utcj.edu.mx" autocomplete="email">
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <div class="extras">
        <label class="recordar">
          <input type="checkbox" name="recordar"> Mantener sesión
        </label>
        <a href="#" class="olvidaste">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="boton-acceder">Acceder</button>
    </form>

    <div class="aviso">
      Acceso exclusivo para personal UTCJ
    </div>

  </div>

</body>
</html>
